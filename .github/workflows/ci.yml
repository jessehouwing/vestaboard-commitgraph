name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Fiestaboard/FiestaBoard
          path: fiestaboard-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r fiestaboard-core/requirements.txt
          pip install pytest pytest-cov
      - name: Set up plugin directory structure
        run: |
          PLUGIN_ID=$(python -c "import json; print(json.load(open('manifest.json'))['id'])")
          mkdir -p plugins
          touch plugins/__init__.py
          ln -s .. "plugins/$PLUGIN_ID"
          ln -s . "$PLUGIN_ID"
      - name: Validate plugin with FiestaBoard tooling
        run: |
          PLUGIN_ID=$(python -c "import json; print(json.load(open('manifest.json'))['id'])")
          mkdir -p "fiestaboard-core/plugins/$PLUGIN_ID"
          cp __init__.py manifest.json README.md "fiestaboard-core/plugins/$PLUGIN_ID/"
          cp -r tests "fiestaboard-core/plugins/$PLUGIN_ID/"
          cd fiestaboard-core
          python scripts/validate_plugins.py --strict --verbose --plugin="$PLUGIN_ID"
      - name: Run tests
        env:
          PYTHONPATH: "${{ github.workspace }}:fiestaboard-core"
          BOARD_READ_WRITE_KEY: test_key
        run: |
          cat > .coveragerc << 'RCEOF'
          [run]
          omit = fiestaboard-core/*
          RCEOF
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-fail-under=70 --ignore=fiestaboard-core
